worker_processes auto;
error_log /var/log/nginx/mess_error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/mess_access.log main;
    error_log /var/log/nginx/mess_error.log;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    client_max_body_size 10m;

    # Upstream backend cluster with sticky sessions
    upstream mess_backend {
        ip_hash;
        server 127.0.0.1:5001;
        server 127.0.0.1:5002;
        server 127.0.0.1:5003;
    }

    server {
        listen 80;
        server_name localhost;

        access_log /var/log/nginx/mess_access.log;
        error_log /var/log/nginx/mess_error.log;

        # Frontend static files (configurable path)
        location / {
            root /usr/share/nginx/html; # Configure frontend static build output directory path here
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # API requests reverse proxy
        location /api/ {
            proxy_pass http://mess_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket / Socket.IO reverse proxy
        location /socket.io/ {
            proxy_pass http://mess_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
